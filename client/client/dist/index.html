<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPTown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-CC4F35sd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CQfQtj34.css">
  </head>
  <body>

    <!-- ── Login screen ──────────────────────────────────── -->
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <div class="login-logo">
          <span class="logo-mark">G</span>
        </div>
        <h1 class="login-title">GPTown</h1>
        <p class="login-sub">Sign in to your local AI</p>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" placeholder="admin" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>
          <p id="login-error" class="login-error" hidden>Wrong username or password.</p>
          <button id="login-btn" type="submit" class="login-btn">Sign in</button>
        </form>
      </div>
    </div>

    <!-- ── Chat app ───────────────────────────────────────── -->
    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="logo">
          <span class="logo-mark">G</span>
          <span class="logo-name">GPTown</span>
        </div>
        <div class="status-pill">
          <span class="status-dot" id="status-dot"></span>
          <span id="status">Connecting…</span>
        </div>
        <div class="topbar-actions">
          <button id="clear-btn" class="icon-btn" title="Clear chat" aria-label="Clear chat">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
            </svg>
          </button>
          <button id="logout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <main id="chat" class="chat-feed"></main>

      <div class="input-wrap">
        <form id="chat-form" class="input-bar">
          <textarea
            id="message"
            placeholder="Message GPTown…"
            rows="1"
            required
          ></textarea>
          <button id="send-btn" type="submit" aria-label="Send">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <p class="input-hint">Enter to send · Shift+Enter for new line</p>
      </div>
    </div>

  </body>
</html>
