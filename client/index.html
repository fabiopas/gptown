<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPTown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script type="module" src="/src/main.js"></script>
</head>

<body>

  <!-- ── Login screen ──────────────────────────────────── -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-mark">G</span>
      </div>
      <h1 class="login-title">GPTown</h1>
      <p class="login-sub">Sign in to your local AI</p>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" placeholder="admin" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <p id="login-error" class="login-error" hidden>Wrong username or password.</p>
        <button id="login-btn" type="submit" class="login-btn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- ── App ───────────────────────────────────────────── -->
  <div id="app" class="app" hidden>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <span class="logo-mark">G</span>
          <span class="logo-name">GPTown</span>
        </div>
        <button id="new-chat-btn" class="icon-btn" title="New chat" aria-label="New chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>

      <div class="sidebar-section-label">Conversations</div>
      <nav id="chat-list" class="chat-list"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="user-avatar">U</div>
          <span id="user-display-name" class="user-display-name">User</span>
        </div>
        <div class="sidebar-footer-actions">
          <button id="admin-btn" class="icon-btn" title="Manage users" aria-label="Manage users" hidden>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </button>
          <button id="logout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main area -->
    <div class="main-area">
      <header class="topbar">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <span id="current-model" class="current-model">GPTown</span>
        <select id="model-select" class="template-select" aria-label="Model selection">
          <option value="gemma4:latest">gemma4:latest</option>
          <option value="llama2-uncensored:7b">llama2-uncensored:7b</option>
          <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
        </select>
        <select id="template-select" class="template-select" aria-label="Prompt template">
          <option value="none">gemma4</option>
        </select>
        <div class="status-pill">
          <span class="status-dot" id="status-dot"></span>
          <span id="status">Connecting…</span>
        </div>
        <button id="new-chat-topbar" class="icon-btn" title="New chat" aria-label="New chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
        </button>
      </header>

      <main id="chat" class="chat-feed"></main>

      <div class="input-wrap">
        <form id="chat-form" class="input-bar">
          <textarea id="message" placeholder="Message GPTown…" rows="1" required></textarea>
          <div class="input-actions">
            <button id="stop-btn" type="button" class="stop-btn" hidden aria-label="Stop generating">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <rect x="4" y="4" width="16" height="16" rx="2" />
              </svg>
            </button>
            <button id="send-btn" type="submit" aria-label="Send">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>
        </form>
        <p class="input-hint">Enter to send · Shift+Enter for new line</p>
      </div>
    </div>

  </div>

  <!-- ── Admin modal ────────────────────────────────────── -->
  <div id="admin-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
      <div class="modal-header">
        <h2 id="admin-modal-title" class="modal-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Manage Users
        </h2>
        <button id="close-admin-modal" class="icon-btn" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-section">
          <h3 class="modal-section-title">Users</h3>
          <div id="users-list" class="users-list">
            <p class="loading-text">Loading…</p>
          </div>
        </div>

        <div class="modal-section">
          <h3 class="modal-section-title">Add User</h3>
          <form id="add-user-form" class="add-user-form" novalidate>
            <div class="add-user-fields">
              <div class="field">
                <label for="new-username">Username</label>
                <input id="new-username" type="text" placeholder="username" autocomplete="off" required />
              </div>
              <div class="field">
                <label for="new-password">Password</label>
                <input id="new-password" type="password" placeholder="••••••••" autocomplete="new-password" required />
              </div>
            </div>
            <label class="checkbox-label">
              <input id="new-is-admin" type="checkbox" />
              <span>Admin</span>
            </label>
            <p id="add-user-error" class="form-error" hidden></p>
            <button id="add-user-btn" type="submit" class="login-btn add-user-submit">Add User</button>
          </form>
        </div>

        <div class="modal-section">
          <h3 class="modal-section-title">Prompt Templates</h3>
          <div id="template-admin-list" class="template-admin-list">
            <p class="loading-text">Loading…</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
