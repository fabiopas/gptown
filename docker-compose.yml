services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gptown-app
    restart: unless-stopped
    ports:
      - "4200:4200"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/gptown.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gptown_data:/app/data

volumes:
  gptown_data:
